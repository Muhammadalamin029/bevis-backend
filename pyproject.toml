[project]
name = "bevis-backend"
version = "0.1.0"
description = "Don't say it. Show proof. Turns GitHub pushes into ready-to-post developer content."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "bcrypt>=5.0.0",
    "celery>=5.6.3",
    "fastapi[standard]>=0.141.1",
    "flower>=2.2.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.13.5",
    "pyjwt>=2.15.1",
    "redis>=8.1.0",
    "sqlalchemy>=2.1.3",
]

[dependency-groups]
dev = [
    "fakeredis>=2.39.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# Narrowly ignore third-party test-tooling noise (starlette's own
# testclient deprecation). Revisit on every dependency upgrade.
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:Warning",
]
